name: CI

on: [push, pull_request]

env:
  PACKAGE_NAME: 'oxid-professional-services/easycredit-module'
  MODULE_PATH: 'vendor/oxid-professional-services/easycredit-module'
  MODULE_TESTS_PATH: 'vendor/oxid-professional-services/easycredit-module/tests'
  FULL_MODULE_PATH: '/tmp/oxid7/vendor/oxid-professional-services/easycredit-module'
  MODULE_BRANCH: 'dev-main'
  OXID_PATH: '/tmp/oxid7'

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        # oxid-versions: ['dev-b-7.0-ce', 'dev-b-7.1-ce', 'dev-b-7.2-ce', 'dev-b-7.3-ce', 'dev-b-7.4-ce', 'dev-b-7.5-ce']
        oxid-versions: ['b-7.5-ce']
        # php-versions: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        php-versions: ['8.3']
        exclude:
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.2'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.3'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.0'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.3'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.0'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.0'
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.0'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.0'
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.2'
    name: Oxid ${{ matrix.oxid-versions }} on PHP ${{ matrix.php-versions }}
    services:
      mysql:
        image: mariadb:latest
        env:
          MYSQL_DATABASE: oxid7_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xdebug, gd, bcmath, ctype, curl, dom, hash, iconv, intl, openssl, simplexml, soap, xsl, zip
          tools: composer:v2

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer -V
        
      - name: Cleanup workspace
        run: |
          ls -la ./
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
          ls -la ./        
        
      - name: Clone testing environment
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        run: git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch ${{ matrix.oxid-versions }} --single-branch source        

      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          make file=services/selenium-chrome.yml addservice
          perl -pi\
            -e "s#PHP_VERSION=.*#PHP_VERSION=${{ matrix.php-versions }}#g;"\
            .env
          perl -pi\
            -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=5.7#g;"\
            .env
          perl -pi\
            -e 's#display_errors =.*#display_errors = false#g;'\
            -e 'print "xdebug.max_nesting_level=1000\nxdebug.mode=coverage\n\n"'\
            containers/php/custom.ini

          perl -pi\
            -e 's#/var/www/#/var/www/source/#g;'\
            containers/httpd/project.conf

      - name: Prepare shop configuration
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php
          sed -i "1s+^+SetEnvIf Authorization "\(.*\)" HTTP_AUTHORIZATION=\$1\n\n+" source/source/.htaccess
          sed -i -e 's/<dbHost>/mysql/'\
                 -e 's/<dbUser>/root/'\
                 -e 's/<dbName>/example/'\
                 -e 's/<dbPwd>/root/'\
                 -e 's/<dbPort>/3306/'\
                 -e 's/<sShopURL>/https:\/\/localhost.local\//'\
                 -e 's/<sShopDir>/\/var\/www\/source\//'\
                 -e 's/<sCompileDir>/\/var\/www\/source\/tmp\//'\
              source/source/config.inc.php

      - name: Start containers
        run: |
          make up
          sleep 2

      # - name: Setup Oxid 7
      #  run: |
          # mkdir $OXID_PATH
          # cd $OXID_PATH
          # composer create-project -n --no-progress --no-install oxid-esales/oxideshop-project . ${{ matrix.oxid-versions }}
          # composer config audit.block-insecure false
          # composer install --no-interaction
          # cp $OXID_PATH/source/config.inc.php.dist $OXID_PATH/source/config.inc.php
          # sed -i 's|<dbHost>|127.0.0.1|; s|<dbName>|oxid7_testing|; s|<dbUser>|root|; s|<dbPwd>|root|; s|<dbPort>|3306|; s|<sShopURL>|http://localhost|; s|<sShopDir>|/tmp/oxid7/source|; s|<sCompileDir>|/tmp/oxid7/source/tmp|; s|\$this->iDebug = 0|\$this->iDebug = 1|' /tmp/oxid7/source/config.inc.php
          # sed -i "s|\$this->edition = ''|\$this->edition = 'CE'|" $OXID_PATH/source/config.inc.php
          # chmod -R 777 $OXID_PATH/source/log
          
#      - name: Install Dev Dependencies
#        run: |
#          sed -i 's/"minimum-stability": "stable",/"minimum-stability": "dev",/' $OXID_PATH/composer.json
#          cd $OXID_PATH
#          composer require --dev -n --no-progress oxid-esales/testing-library:dev-b-8.0.x
#          composer install --no-interaction
#          composer dump-autoload
#          cat $OXID_PATH/composer.lock
          
      - name: Checkout current module
        uses: actions/checkout@v5

      - name: copy module
        run: |
          mkdir -p "$(dirname "$OXID_PATH/$MODULE_PATH")"
          rsync -a --delete "$GITHUB_WORKSPACE/" "$OXID_PATH/$MODULE_PATH/"


      - name: Install module
        run: |
          cd $OXID_PATH
          ls -la $OXID_PATH/$MODULE_PATH
          composer config repositories.$PACKAGE_NAME\
            --json '{"type":"path", "url":"$FULL_MODULE_PATH"}'
          composer config audit.block-insecure false
          composer require $PACKAGE_NAME:* --no-interaction --no-update          

      - name: Prepare test config yml
        run: |
          mv $FULL_MODULE_PATH/.github/test_config.yml $OXID_PATH/test_config.yml

      - name: make sure tmp exists
        run: |
            cd $OXID_PATH
            mkdir -p $OXID_PATH/source/tmp

      - name: Reset Oxid
        run: |
          cd $OXID_PATH
          ls -la source/tmp
          $OXID_PATH/vendor/bin/reset-shop
        
      - name: Install Module in Oxid
        run: |
          cd $OXID_PATH
          ls -la $OXID_PATH/$MODULE_PATH
          vendor/bin/oe-console oe:module:install $MODULE_PATH
          vendor/bin/oe-console oe:module:apply-configuration          
          
      - name: Run tests
        run: |
          mv $FULL_MODULE_PATH/.github/test_config.yml $OXID_PATH/test_config.yml
          php $OXID_PATH/vendor/bin/runtests $OXID_PATH/$MODULE_TESTS_PATH        
          
      # - name: Run phpunit without testing library 
      #  run: |
      #    cd $OXID_PATH
      #    mv $FULL_MODULE_PATH/.github/test_config.yml $OXID_PATH/test_config.yml
      #    php vendor/bin/phpunit --bootstrap vendor/oxid-esales/testing-library/bin/../bootstrap.php vendor/oxid-professional-services/easycredit-module/tests/Unit
          
            

          
          
