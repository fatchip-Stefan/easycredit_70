name: CI

on: [push, pull_request]

jobs:
  run-b7-matrix:
    if: startsWith(github.ref_name, 'b-7.')
    runs-on: ${{ matrix.operating-system }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        oxid-versions: ['dev-b-7.0-ce', 'dev-b-7.1-ce', 'dev-b-7.2-ce', 'dev-b-7.3-ce', 'dev-b-7.4-ce', 'dev-b-7.5-ce']
        php-versions: ['8.1', '8.2', '8.3', '8.4', '8.5']
        exclude:
          - oxid-versions: 'dev-b-7.0-ce'
          - php-versions: '8.1'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.2'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.3'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.0-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.5'            
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.5'            
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.1'            
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.2'
            
    name: Oxid ${{ matrix.oxid-versions }} on PHP ${{ matrix.php-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xdebug, gd, bcmath, ctype, curl, dom, hash, iconv, intl, openssl, simplexml, soap, xsl, zip
          tools: composer:v2

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer -V

      - name: Cleanup workspace
        run: |
          ls -la ./
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
          ls -la ./        

      - name: Clone testing environment
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        if: startsWith(github.ref_name, 'b-7.')
        run: |
          # git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch b-${{ matrix.oxid-versions }}.x --single-branch source
          composer create-project -n --no-progress --no-install oxid-esales/oxideshop-project ./source ${{ matrix.oxid-versions }}
          cd source
          composer config audit.block-insecure false
          composer install --no-progress --no-suggest --no-interaction


      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          make file=services/selenium-chrome.yml addservice
          perl -pi\
            -e "s#PHP_VERSION=.*#PHP_VERSION=${{ matrix.php-versions }}#g;"\
            .env
          perl -pi\
            -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=5.7#g;"\
            .env
          perl -pi\
            -e 's#display_errors =.*#display_errors = false#g;'\
            -e 'print "xdebug.max_nesting_level=1000\nxdebug.mode=coverage\n\n"'\
            containers/php/custom.ini

          perl -pi\
            -e 's#/var/www/#/var/www/source/#g;'\
            containers/httpd/project.conf

      - name: Prepare shop configuration
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php
          sed -i "1s+^+SetEnvIf Authorization "\(.*\)" HTTP_AUTHORIZATION=\$1\n\n+" source/source/.htaccess

      - name: Start containers
        run: |
          make up
          sleep 5

      - name: Checkout current module
        uses: actions/checkout@v5
        with:
          path: source/extensions/easycredit

      - name: set composer.json to dev stability
        run: |
          docker compose exec -T \
          php sed -i 's/"minimum-stability": "stable",/"minimum-stability": "dev",/' /var/www/composer.json          

      - name: Install module Oxid 7
        run: |
          docker compose exec -T \
            php composer config repositories.oxid-professional-services/easycredit-module \
            --json '{"type":"path", "url":"/var/www/extensions/easycredit", "options": {"symlink": true}}'
          docker compose exec -T \
            php composer config audit.block-insecure false
          docker compose exec -T php composer require oxid-professional-services/easycredit-module:*  --no-update
          docker compose exec -T php composer update
          docker compose exec -T php composer dump
          docker compose exec -T php cat composer.json

      - name: Setup Shop and demodata Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:setup:shop \
            --db-host mysql \
            --db-port 3306 \
            --db-name example \
            --db-user root \
            --db-password root \
            --shop-url http://localhost.local \
            --shop-directory /var/www/source \
            --compile-directory /var/www/source/tmp \
            --language=de

      - name: make sure log folder exists
        run: |
          docker compose exec -T php mkdir -p /var/www/source/log

      - name: Install Easycredit Module Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:module:install extensions/easycredit          

      - name: Install Apex Theme Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:theme:activate apex          

      - name: Activate Easycredit Module Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:module:activate osceasycredit

      - name: Put module settings
        run: |
          mkdir -p source/var/www/var/configuration/shops/1/modules
          echo "${{ secrets.MODULE_SETTINGS }}" > source/var/configuration/shops/1/modules/osceasycredit.yaml

      - name: Clear Oxid 7 Cache
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:cache:clear          

      - name: Install Testing Lib Oxid 7
        run: |
          docker compose exec -T \
            php composer require oxid-esales/testing-library:dev-b-8.0.x
          docker compose exec -T \
            php composer update          

      - name: add test_yaml Oxid 7
        run: |
          docker compose exec -T php ls -la /var/www
          docker compose exec -T php mv /var/www/extensions/easycredit/.github/test_config.yml /var/www/test_config.yml          

      - name: Run phpunit tests Oxid 7
        run: |
          docker compose exec -T \
           php ls -la /var/www/extensions/easycredit
          docker compose exec -T \
           php /var/www/vendor/bin/phpunit \
             -c /var/www/extensions/easycredit/tests/phpunit.xml \
             --testsuite=Integration \
             --bootstrap=/var/www/source/bootstrap.php \
             /var/www/extensions/easycredit/tests | tee integration_PHP${{ matrix.php-versions }}_phpunit_log.txt 2>&1 || true
          if grep -q -Ei 'fail|\\.\\=\\=|Warning|Notice|Deprecated|Fatal|Error' integration_PHP${{ matrix.php-versions }}_phpunit_log.txt; then 
            exit 1; 
          fi


          
  run-b6-matrix:
    if: startsWith(github.ref_name, 'b-6.')
    runs-on: ${{ matrix.operating-system }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        oxid-versions: ['6.5']
        php-versions: ['8.0', '8.1']
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xdebug, gd, bcmath, ctype, curl, dom, hash, iconv, intl, openssl, simplexml, soap, xsl, zip
          tools: composer:v2

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer -V

      - name: Cleanup workspace
        run: |
          ls -la ./
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
          ls -la ./

      - name: Clone testing environment
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        run: |
          git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch b-${{ matrix.oxid-versions }}.x --single-branch source

      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          make file=services/selenium-chrome.yml addservice
          perl -pi\
            -e "s#PHP_VERSION=.*#PHP_VERSION=${{ matrix.php-versions }}#g;"\
            .env
          perl -pi\
            -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=5.7#g;"\
            .env
          perl -pi\
            -e 's#display_errors =.*#display_errors = false#g;'\
            -e 'print "xdebug.max_nesting_level=1000\nxdebug.mode=coverage\n\n"'\
            containers/php/custom.ini

          perl -pi\
            -e 's#/var/www/#/var/www/source/#g;'\
            containers/httpd/project.conf

      - name: Prepare shop configuration
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php
          sed -i "1s+^+SetEnvIf Authorization "\(.*\)" HTTP_AUTHORIZATION=\$1\n\n+" source/source/.htaccess
          sed -i -e 's/<dbHost>/mysql/'\
                 -e 's/<dbUser>/root/'\
                 -e 's/<dbName>/example/'\
                 -e 's/<dbPwd>/root/'\
                 -e 's/<dbPort>/3306/'\
                 -e 's/<sShopURL>/https:\/\/localhost.local\//'\
                 -e 's/<sShopDir>/\/var\/www\/source\//'\
                 -e 's/<sCompileDir>/\/var\/www\/source\/tmp\//'\
              source/source/config.inc.php

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Install dependencies and reset shop
        run: |
          docker compose exec -T \
            php composer config audit.block-insecure false
          docker compose exec -T php composer update --no-interaction --no-scripts
          docker compose exec -T php php vendor/bin/reset-shop      
          
      - name: Test0
        run: |
          docker compose exec -T \
          php ls -la /var/www/vendor/bin  
          
      - name: Checkout current module
        uses: actions/checkout@v5
        with:
          path: source/extensions/easycredit
          
      #- name: set composer.json to dev stability
      #  run: |
      #    docker compose exec -T \
      #    php sed -i 's/"minimum-stability": "stable",/"minimum-stability": "dev",/' /var/www/composer.json
          
      - name: Test1
        run: |
          ls -la source
          
      - name: Test2
        run: |
          docker compose exec -T \
          php ls -la /var/www        
          
      - name: Test3
        run: |
          docker compose exec -T \
          php ls -la /var/www/var
          
      - name: Test4
        run: |
          docker compose exec -T \
          php ls -la /var/www/vendor/bin                
          
      - name: Install module
        run: |
          docker compose exec -T \
            php composer config repositories.oxid-professional-services/easycredit-module \
            --json '{"type":"path", "url":"/var/www/extensions/easycredit", "options": {"symlink": true}}'
          docker compose exec -T \
            php composer config audit.block-insecure false
          docker compose exec -T php composer require oxid-professional-services/easycredit-module:* --no-interaction --no-update

      - name: Activate Easycredit Module
        continue-on-error: true
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:module:activate oxpseasycredit

      - name: Clear Oxid Cache
        continue-on-error: true
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:cache:clear          

      - name: Put module settings
        continue-on-error: true
        run: |
          mkdir -p /var/www/var/configuration/shops/1/modules
          echo "${{ secrets.MODULE_SETTINGS }}" > source/var/configuration/shops/1/modules/osceasycredit.yaml
          cat source/var/configuration/shops/1/modules/osceasycredit.yaml          

      - name: Run phpunit tests
        continue-on-error: true
        run: |
          docker compose exec -T \
           php /var/www/vendor/bin/phpunit \
             -c /var/www/extensions/easycredit/Tests/phpunit.xml \
             --testsuite=Integration \
             --bootstrap=/var/www/source/bootstrap.php \
             /var/www/extensions/easycredit/Tests | tee integration_PHP${{ matrix.php-versions }}_phpunit_log.txt 2>&1 || true
          if grep -q -Ei 'fail|\\.\\=\\=|Warning|Notice|Deprecated|Fatal|Error' integration_PHP${{ matrix.php-versions }}_phpunit_log.txt; then 
            exit 1; 
          fi

      - name: Run tests with testing lib
        continue-on-error: true
        run: |
          # docker compose exec -T php ls -la  /var/www/vendor/bin 
          docker compose exec -T php /var/www/vendor/bin/runtests     
  